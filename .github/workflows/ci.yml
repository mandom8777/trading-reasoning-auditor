name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc -p tsconfig.json --noEmit
      - name: Test
        run: npm test --silent
